<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unsubscribed — Kulmi</title>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #FDFBF7; color: #2D2926; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { max-width: 480px; margin: 24px; background: #fff; border: 1px solid #E5E0D8; border-radius: 24px; padding: 40px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    h1 { color: #1B4332; font-family: Georgia, serif; font-style: italic; margin-top: 0; }
    p { color: #5C574F; line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; background: #1B4332; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="t">You've been unsubscribed</h1>
    <p id="m">You won't receive further update emails from Kulmi. You'll still get essential account emails, like password resets.</p>
    <a href="https://kulmi.uk">Return to Kulmi</a>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('ok') === '0') {
      document.getElementById('t').textContent = 'Link expired';
      document.getElementById('m').textContent = "We couldn't verify this unsubscribe link. You can also turn off emails anytime in your Kulmi settings.";
    }
  </script>
</body>
</html>
